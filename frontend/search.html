<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Harbor — Find people</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-shell">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <div class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 12c0-4.4 3.6-8 8-8s8 3.6 8 8-3.6 8-8 8H4l2.5-3.2C5 15.4 4 13.8 4 12Z" stroke="#F7F4EE" stroke-width="1.6" stroke-linejoin="round"/></svg>
        </div>
        <span class="brand-name">Harbor</span>
      </div>
      <button class="icon-btn" id="logoutBtn" title="Log out">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" stroke="#F7F4EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <nav class="sidebar-nav">
      <a class="nav-btn" href="chats.html">Chats</a>
      <a class="nav-btn" href="connections.html">Connections<span class="nav-badge hidden" id="pendingBadge">0</span></a>
      <a class="nav-btn active" href="search.html">Find people</a>
      <a class="nav-btn" href="profile.html">Profile</a>
    </nav>
  </aside>

  <main class="chat-area content-main">
    <div class="content-header">
      <h1>Find people</h1>
      <p>Search by email address or phone number, then send a connection request.</p>
    </div>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search by email or phone" />
    </div>

    <div class="card-list" id="searchResultsList">
      <div class="empty-block">Results will appear here once you start typing.</div>
    </div>
  </main>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/shared.js"></script>
<script src="js/search.js"></script>
</body>
</html>
