<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Harbor — Reset password</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="auth-screen">

  <div class="auth-hero">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 12c0-4.4 3.6-8 8-8s8 3.6 8 8-3.6 8-8 8H4l2.5-3.2C5 15.4 4 13.8 4 12Z" stroke="#F7F4EE" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </div>
      <span class="brand-name">Harbor</span>
    </div>
    <p class="auth-hero-quote">Where every conversation <em>finds safe harbor</em> — quick to reach, easy to keep.</p>
    <p class="auth-hero-foot">Built for people who'd rather talk than type twice.</p>
  </div>

  <div class="auth-panel">
    <div class="auth-card">
      <div class="brand">
        <div class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 12c0-4.4 3.6-8 8-8s8 3.6 8 8-3.6 8-8 8H4l2.5-3.2C5 15.4 4 13.8 4 12Z" stroke="#F7F4EE" stroke-width="1.6" stroke-linejoin="round"/></svg>
        </div>
        <span class="brand-name">Harbor</span>
      </div>

      <h2 style="font-family:var(--font-display); font-style:italic; font-weight:600; font-size:1.3rem; margin:0 0 22px; color:var(--ink);">Reset your password</h2>

      <div id="statusMsg" class="status-msg"></div>

      <div class="step-indicator">
        <div class="step-dot active" data-step="1"></div>
        <div class="step-dot" data-step="2"></div>
        <div class="step-dot" data-step="3"></div>
      </div>

      <!-- step 1: request otp -->
      <div id="fpStep1">
        <div class="field">
          <label for="fpEmail">Email</label>
          <input type="email" id="fpEmail" required placeholder="you@example.com" />
        </div>
        <div class="field">
          <label for="fpPhone">Phone (on file)</label>
          <input type="tel" id="fpPhone" required placeholder="+1 555 000 0000" />
        </div>
        <button type="button" id="fpSendOtpBtn" class="btn btn-primary">Send OTP</button>
      </div>

      <!-- step 2: verify otp -->
      <div id="fpStep2" class="hidden">
        <div class="field">
          <label for="fpOtp">Enter the OTP</label>
          <input type="text" id="fpOtp" required placeholder="6-digit code" maxlength="6" />
        </div>
        <button type="button" id="fpVerifyOtpBtn" class="btn btn-primary">Verify OTP</button>
      </div>

      <!-- step 3: reset password -->
      <div id="fpStep3" class="hidden">
        <div class="field">
          <label for="fpNewPassword">New password</label>
          <input type="password" id="fpNewPassword" required placeholder="••••••••" />
        </div>
        <div class="field">
          <label for="fpConfirmPassword">Confirm new password</label>
          <input type="password" id="fpConfirmPassword" required placeholder="••••••••" />
        </div>
        <button type="button" id="fpResetBtn" class="btn btn-primary">Reset password</button>
      </div>

      <p class="form-note">Remembered it? <a href="index.html" style="color:var(--teal); font-weight:600; text-decoration:none;">Back to log in</a></p>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/forgot-password.js"></script>
</body>
</html>
