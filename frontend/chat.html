<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Harbor — Chat</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-shell">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <div class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 12c0-4.4 3.6-8 8-8s8 3.6 8 8-3.6 8-8 8H4l2.5-3.2C5 15.4 4 13.8 4 12Z" stroke="#F7F4EE" stroke-width="1.6" stroke-linejoin="round"/></svg>
        </div>
        <span class="brand-name">Harbor</span>
      </div>
      <button class="icon-btn" id="logoutBtn" title="Log out">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" stroke="#F7F4EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <nav class="sidebar-nav">
      <a class="nav-btn active" href="chats.html">Chats</a>
      <a class="nav-btn" href="connections.html">Connections<span class="nav-badge hidden" id="pendingBadge">0</span></a>
      <a class="nav-btn" href="search.html">Find people</a>
      <a class="nav-btn" href="profile.html">Profile</a>
    </nav>

    <div class="sidebar-search">
      <input type="text" id="chatFilterInput" placeholder="Search your chats" />
    </div>
    <div class="sidebar-list" id="sidebarChatList">
      <div class="list-empty">Loading your connections…</div>
    </div>
  </aside>

  <main class="chat-area" id="chatArea">
    <div style="display:flex; flex-direction:column; height:100%;">
      <div class="chat-header">
        <a class="icon-btn back-btn" href="chats.html" style="background:var(--paper-dim); color:var(--ink); text-decoration:none;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="#1C2B2F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
        <div class="avatar" id="chatHeaderAvatar">?</div>
        <div style="flex:1; min-width:0;">
          <div class="chat-header-name" id="chatHeaderName">—</div>
          <div class="chat-header-sub" id="chatHeaderSub">—</div>
        </div>
        <span class="conn-status offline" id="wsStatus">Offline</span>
      </div>

      <div class="chat-messages" id="chatMessages"></div>

      <div class="chat-composer">
        <input type="text" id="messageInput" placeholder="Type a message" autocomplete="off" />
        <button class="send-btn" id="sendMessageBtn" title="Send">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7Z" stroke="#F7F4EE" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </main>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/shared.js"></script>

<!-- WebSocket libraries -->
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.2.1/bundles/stomp.umd.min.js"></script>

<!-- Your chat JavaScript -->
<script src="js/chat.js"></script>
</body>
</html>
